<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eu Te Amo Eliza</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffb6c1; /* Fundo rosa */
            text-align: center;
            padding: 50px;
            color: white;
            height: 100vh;
        }

        h1 {
            font-size: 3em;
            margin: 20px;
        }

        #timer {
            font-size: 2em;
            font-weight: bold;
            margin-top: 30px;
        }

        #romanticButton {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #e91e63;
            color: white;
            transition: all 0.3s ease;
        }

        #romanticButton:hover {
            background-color: #c2185b;
            box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.5);
            transform: scale(1.1);
        }

        #romanticButton:active {
            transform: scale(0.95);
        }

        #message {
            margin-top: 20px;
            font-size: 1.2em;
            font-style: italic;
        }

        audio {
            display: none; /* Não exibe o player de áudio */
        }
    </style>
</head>
<body>
    <h1>Eu Te Amo, Eliza!</h1>

    <div id="timer"></div>

    <button id="romanticButton">Clique para uma mensagem romântica</button>
    <p id="message"></p>

    <!-- Adicionando música ambiente romântica -->
    <audio autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
        Seu navegador não suporta a reprodução de áudio.
    </audio>

    <script>
        // Função para calcular a data futura de 3 meses e 3 dias à frente
        function updateTimer() {
            const now = new Date();

            // Adicionar 3 meses e 3 dias à data atual
            const futureDate = new Date(now);
            futureDate.setMonth(now.getMonth() + 3); // Adicionar 3 meses
            futureDate.setDate(now.getDate() + 3);   // Adicionar 3 dias

            // Calcular a diferença entre o momento atual e a data futura
            const diff = futureDate - now;

            // Calcular meses, dias, horas, minutos e segundos restantes
            const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 30;
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Exibir a contagem crescente
            document.getElementById("timer").innerHTML = 
                `${months} meses, ${days} dias, ${hours} horas, ${minutes} minutos, ${seconds} segundos`;
        }

        // Atualizar o timer a cada 1 segundo
        setInterval(updateTimer, 1000);

        // Função para gerar mensagens românticas
        const messages = [
            "Você é meu sonho mais lindo.",
            "Cada dia com você é um presente.",
            "Te amo mais a cada segundo que passa.",
            "Juntos, podemos conquistar o mundo.",
            "Você é tudo o que eu sempre sonhei."
        ];

        document.getElementById("romanticButton").addEventListener("click", () => {
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById("message").textContent = randomMessage;
        });
    </script>
</body>
</html>
